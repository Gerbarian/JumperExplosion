<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SNS Flappy">
  <meta name="theme-color" content="#09060c">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Short n' Sweet Flappy — high-fashion chaos. One tap. Ride the edge.">
  <title>Short n' Sweet Flappy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%2309060c' width='64' height='64'/%3E%3Cpath fill='%23ff2bd6' d='M36 6L14 36h16l-4 22 24-32H34l2-20z'/%3E%3C/svg%3E">
  <style>
    :root { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #09060c;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
  /**
   * Short n' Sweet Flappy — UNHINGED CUT
   * Core loop unchanged: one-tap flap, gravity, gates, pass-to-score, death, instant retry.
   * Everything else is pressure: snappy physics, living gates, graze payouts, heat, surges.
   * WKWebView-safe. Capacitor-ready. haptic() is the swap point for native haptics.
   */
  (function () {
    'use strict';

    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

    var W = 390, H = 844, S = 1, dpr = 1, groundH = 92, safeTop = 0;

    function measureSafeTop() {
      var d = document.createElement('div');
      d.style.cssText = 'position:absolute;top:0;left:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      safeTop = d.offsetHeight || 0;
      document.body.removeChild(d);
    }

    function resize() {
      var vv = window.visualViewport;
      var cssW = Math.max(1, Math.round(vv && vv.width ? vv.width : window.innerWidth));
      var cssH = Math.max(1, Math.round(vv && vv.height ? vv.height : window.innerHeight));
      var oldW = W, oldH = H;
      measureSafeTop();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = cssW; H = cssH; S = H / 800;
      groundH = Math.max(78, Math.min(118, H * 0.11));
      if (oldW > 1 && player) {
        player.x = W * 0.27;
        player.y *= H / oldH;
        player.r = 24 * S;
        for (var i = 0; i < pipes.length; i++) {
          pipes[i].x *= W / oldW;
          pipes[i].gapY *= H / oldH;
          pipes[i].baseGapY *= H / oldH;
        }
      }
    }

    var STATE = { MENU: 0, PLAY: 1, DEAD: 2, OVER: 3 };
    var STORAGE_KEY = 'sns-flappy-best';
    var FONT = 'Arial Black,Arial,Helvetica Neue,sans-serif';
    var MEDALS = [
      { name: 'SPARK', min: 10,  c1: '#5c4030', c2: '#e0a060' },
      { name: 'VOLT',  min: 25,  c1: '#2a3a48', c2: '#c8e8ff' },
      { name: 'ICON',  min: 50,  c1: '#7a0a3a', c2: '#ff4da6' },
      { name: 'VOID',  min: 100, c1: '#0a0a0a', c2: '#d0ff3a' }
    ];

    var state = STATE.MENU;
    var score = 0, best = 0, newBest = false;
    var combo = 1, cleanPasses = 0;
    var deadT = 0, time = 0, lastTs = 0, inputLock = 0;
    var shake = 0, flash = 0, chroma = 0, hitStop = 0;
    var flapSquash = 0, comboPulse = 0, hudPop = 0, bestBannerT = 0;
    var surgeT = 0, surgeLeft = 0, surgeWarn = 0, nextSurgeAt = 8;
    var heat = 0, heatSmooth = 0;
    var deathFlash = 0, glitchT = 0;

    var player = { x: 0, y: 0, vy: 0, rot: 0, r: 24, alive: true };
    var trail = [];
    var pipes = [];
    var particles = [];
    var floaters = [];
    var slashes = [];
    var glitches = [];
    var PARTICLE_CAP = 160;

    function loadBest() {
      try {
        var n = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
        return isFinite(n) && n > 0 ? n : 0;
      } catch (e) { return 0; }
    }
    function saveBest(n) {
      try { localStorage.setItem(STORAGE_KEY, String(n)); } catch (e) { /* private mode */ }
    }
    best = loadBest();

    function canVibrate() {
      return typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
    }
    function haptic(pattern) {
      if (!canVibrate()) return;
      try { navigator.vibrate(pattern); } catch (e) { /* iOS / WKWebView no-op */ }
    }
    function hapticFlap()  { haptic(10); }
    function hapticScore() { haptic(22); }
    function hapticGraze() { haptic([18, 24, 40, 20, 18]); }
    function hapticSurge() { haptic([8, 40, 8, 40, 30]); }
    function hapticDeath() { haptic([60, 30, 90, 40, 140]); }
    function hapticCombo() { haptic([12, 20, 28]); }

    var audioCtx = null;
    var noiseBuf = null;

    function ensureAudio() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (audioCtx && !noiseBuf) {
          noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.35, audioCtx.sampleRate);
          var d = noiseBuf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        }
      } catch (e) { /* ignore */ }
    }

    function tone(freq, dur, type, vol, slide) {
      if (!audioCtx) return;
      try {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), audioCtx.currentTime + dur);
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(vol || 0.07, audioCtx.currentTime + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
      } catch (e) { /* ignore */ }
    }

    function noise(dur, vol, hp) {
      if (!audioCtx || !noiseBuf) return;
      try {
        var src = audioCtx.createBufferSource();
        src.buffer = noiseBuf;
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        if (hp && audioCtx.createBiquadFilter) {
          var f = audioCtx.createBiquadFilter();
          f.type = 'highpass'; f.frequency.value = hp;
          src.connect(f); f.connect(g);
        } else src.connect(g);
        g.connect(audioCtx.destination);
        src.start();
      } catch (e) { /* ignore */ }
    }

    function sfxFlap()  { tone(420, 0.055, 'square', 0.05, 180); noise(0.04, 0.03, 900); }
    function sfxScore() { tone(880, 0.06, 'square', 0.06); tone(1320, 0.09, 'triangle', 0.04); }
    function sfxGraze() { noise(0.12, 0.1, 400); tone(1480, 0.1, 'sawtooth', 0.05, 2200); }
    function sfxCombo() { tone(220, 0.05, 'square', 0.05); tone(440, 0.07, 'square', 0.05); tone(880, 0.1, 'square', 0.05); }
    function sfxSurge() { tone(140, 0.16, 'sawtooth', 0.07, 90); tone(980, 0.08, 'square', 0.04); }
    function sfxDeath() { noise(0.28, 0.16, 120); tone(180, 0.32, 'sawtooth', 0.08, 50); }
    function sfxBest()  { tone(523, 0.08, 'square', 0.05); tone(784, 0.1, 'square', 0.05); tone(1046, 0.16, 'square', 0.05); }

    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function comboFromPasses(n) {
      if (n >= 14) return 5;
      if (n >= 9) return 4;
      if (n >= 5) return 3;
      if (n >= 2) return 2;
      return 1;
    }

    function gapSize() {
      var t = clamp(score / 42, 0, 1);
      t = t * t;
      return lerp(226, 152, t) * S;
    }
    function minGap() { return 148 * S; }
    function pipeSpeed() {
      var t = clamp(score / 50, 0, 1);
      var comboBoost = 1 + (combo - 1) * 0.045;
      var surgeBoost = surgeT > 0 ? 1.12 : 1;
      return lerp(188, 292, t) * S * comboBoost * surgeBoost;
    }
    function pipeSpacing() {
      var t = clamp(score / 36, 0, 1);
      return lerp(262, 196, t) * S;
    }
    function bobAmpFor() {
      if (score < 6) return 0;
      return lerp(0, 20 * S, clamp((score - 6) / 28, 0, 1));
    }
    function irregular() {
      return lerp(0, 0.16, clamp((score - 8) / 30, 0, 1));
    }
    function medalFor(s) {
      var m = null;
      for (var i = 0; i < MEDALS.length; i++) if (s >= MEDALS[i].min) m = MEDALS[i];
      return m;
    }
    function calcHeat() {
      return clamp(score / 36 + (combo - 1) * 0.14 + (surgeT > 0 ? 0.18 : 0), 0, 1);
    }

    function spawnP(x, y, vx, vy, life, size, color, kind) {
      if (particles.length >= PARTICLE_CAP) particles.shift();
      particles.push({ x: x, y: y, vx: vx, vy: vy, t: 0, life: life, size: size, color: color, kind: kind || 'dot', rot: rand(0, 6) });
    }
    function burst(x, y, n, color, speed, kind) {
      for (var i = 0; i < n; i++) {
        var a = rand(0, Math.PI * 2);
        var sp = rand(speed * 0.25, speed);
        spawnP(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.28, 0.75), rand(2, 7) * S, color, kind);
      }
    }
    function spawnFloater(x, y, text, color, size) {
      floaters.push({ x: x, y: y, text: text, color: color, t: 0, life: 0.7, size: size || 16 * S });
    }
    function spawnSlash(x, y, ang, len, color) {
      slashes.push({ x: x, y: y, ang: ang, len: len, color: color, t: 0, life: 0.18 });
    }

    function spawnGlitch() {
      if (glitches.length > 18) glitches.shift();
      glitches.push({
        x: rand(0, W), y: rand(0, H - groundH),
        w: rand(18, 90) * S, h: rand(3, 14) * S,
        t: 0, life: rand(0.05, 0.16),
        color: Math.random() < 0.5 ? '#ff2bd6' : '#2bfff0'
      });
    }

    function resetRun(startPlaying) {
      player.x = W * 0.27;
      player.y = H * 0.42;
      player.vy = 0; player.rot = 0;
      player.r = 24 * S; player.alive = true;
      pipes = []; trail = [];
      particles.length = 0; floaters.length = 0; slashes.length = 0; glitches.length = 0;
      score = 0; combo = 1; cleanPasses = 0;
      deadT = 0; shake = 0; flash = 0; chroma = 0; hitStop = 0;
      flapSquash = 0; comboPulse = 0; hudPop = 0;
      newBest = false; bestBannerT = 0;
      surgeT = 0; surgeLeft = 0; surgeWarn = 0; nextSurgeAt = 8;
      heat = 0; heatSmooth = 0; deathFlash = 0; glitchT = 0;
      spawnPipe(W + 50 * S, false);
      spawnPipe(W + 50 * S + pipeSpacing(), false);
      if (startPlaying) {
        state = STATE.PLAY;
        doFlap(true);
      } else {
        state = STATE.MENU;
      }
    }

    function spawnPipe(x, forceHot) {
      var gap = gapSize();
      var hot = forceHot || surgeLeft > 0;
      if (hot && surgeLeft > 0) surgeLeft -= 1;
      if (hot) gap = Math.max(minGap(), gap * 0.88);
      var margin = 40 * S + groundH;
      var minY = 64 * S + gap * 0.5;
      var maxY = H - margin - gap * 0.5;
      var gapY = rand(minY, Math.max(minY + 1, maxY));
      var irr = irregular();
      pipes.push({
        x: x,
        gapY: gapY,
        baseGapY: gapY,
        gap: gap,
        w: (hot ? 62 : 58) * S,
        scored: false,
        flash: 0,
        phase: rand(0, Math.PI * 2),
        bobAmp: bobAmpFor() * (hot ? 1.25 : 1),
        tilt: rand(-0.05, 0.05),
        hot: hot,
        jitter: irr * rand(-1, 1)
      });
    }

    function startSurge() {
      if (surgeT > 0.4) return;
      surgeT = 2.6;
      surgeLeft = 2;
      surgeWarn = 1;
      hapticSurge();
      sfxSurge();
      flash = Math.max(flash, 0.45);
      chroma = Math.max(chroma, 0.7);
      spawnFloater(W * 0.5, H * 0.28, 'SURGE', '#ff2b4a', 28 * S);
    }

    function doFlap(silent) {
      player.vy = -520 * S;
      flapSquash = 1;
      if (!silent) { hapticFlap(); sfxFlap(); }
      for (var i = 0; i < 8; i++) {
        spawnP(
          player.x - 12 * S, player.y + rand(-6, 8) * S,
          rand(-140, -30) * S, rand(-80, 80) * S,
          rand(0.18, 0.4), rand(2, 5) * S,
          Math.random() < 0.5 ? '#ff2bd6' : '#ffffff',
          Math.random() < 0.4 ? 'slash' : 'dot'
        );
      }
    }

    function die() {
      if (state !== STATE.PLAY) return;
      state = STATE.DEAD;
      player.alive = false;
      deadT = 0;
      hitStop = 0.09;
      shake = 22 * S;
      flash = 1;
      deathFlash = 1;
      chroma = 1;
      glitchT = 0.55;
      hapticDeath();
      sfxDeath();
      burst(player.x, player.y, 22, '#ff2bd6', 340 * S, 'shard');
      burst(player.x, player.y, 18, '#ffffff', 280 * S, 'slash');
      burst(player.x, player.y, 12, '#2bfff0', 240 * S, 'rect');
      for (var i = 0; i < 8; i++) spawnGlitch();
    }

    function onScore(pipe, graze) {
      cleanPasses += 1;
      var next = comboFromPasses(cleanPasses);
      var gained = combo;
      if (pipe.hot) gained += combo;
      if (graze) gained += 2 + combo;
      score += gained;
      hudPop = 1;
      pipe.scored = true;
      if (graze) {
        pipe.flash = 1;
        hapticGraze();
        sfxGraze();
        shake = 11 * S;
        flash = 0.7;
        chroma = 0.95;
        glitchT = Math.max(glitchT, 0.22);
        spawnFloater(player.x + 40 * S, pipe.gapY - 36 * S, 'GRAZE +' + (2 + combo), '#d0ff3a', 18 * S);
        burst(player.x + 16 * S, player.y, 18, '#d0ff3a', 260 * S, 'slash');
        spawnSlash(player.x, player.y, rand(-0.6, 0.6), 90 * S, '#d0ff3a');
        spawnSlash(player.x, player.y, rand(2.4, 3.6), 70 * S, '#ffffff');
        for (var g = 0; g < 4; g++) spawnGlitch();
      } else {
        hapticScore();
        sfxScore();
        if (pipe.hot) {
          flash = Math.max(flash, 0.35);
          spawnFloater(player.x + 30 * S, player.y - 24 * S, 'HOT +' + gained, '#ff2b4a', 16 * S);
        }
      }
      if (next > combo) {
        combo = next;
        comboPulse = 1;
        hapticCombo();
        sfxCombo();
        spawnFloater(player.x, player.y - 48 * S, 'x' + combo + (combo >= 5 ? ' OVERDRIVE' : ''), '#ff2bd6', 20 * S);
        burst(player.x, player.y, 16, '#ff2bd6', 200 * S, 'spark');
        chroma = Math.max(chroma, 0.5);
      } else {
        combo = next;
      }
      spawnFloater(player.x + 26 * S, player.y - 8 * S, '+' + gained, graze ? '#d0ff3a' : '#ffffff', 15 * S);
      if (score >= nextSurgeAt) {
        startSurge();
        nextSurgeAt = score + 8;
      }
    }

    function finishDeath() {
      state = STATE.OVER;
      if (score > best) {
        best = score;
        newBest = true;
        saveBest(best);
        bestBannerT = 1.8;
        sfxBest();
        for (var i = 0; i < 36; i++) {
          spawnP(rand(W * 0.15, W * 0.85), rand(H * 0.18, H * 0.5),
            rand(-80, 80) * S, rand(-40, 120) * S, rand(0.7, 1.3), rand(3, 8) * S,
            Math.random() < 0.5 ? '#d0ff3a' : '#ff2bd6', 'shard');
        }
      }
    }

    function onInput(e) {
      if (e) {
        if (e.cancelable) e.preventDefault();
        if (e.touches && e.touches.length > 1) return;
      }
      var now = performance.now();
      if (now - inputLock < 26) return;
      inputLock = now;
      ensureAudio();
      if (state === STATE.MENU || state === STATE.OVER) {
        hapticFlap();
        resetRun(true);
        return;
      }
      if (state === STATE.PLAY) doFlap(false);
    }

    function update(dt) {
      var realDt = dt;
      if (hitStop > 0) {
        hitStop -= realDt;
        dt *= 0.12;
      }
      time += dt;
      heat = calcHeat();
      heatSmooth = lerp(heatSmooth, heat, Math.min(1, dt * 3.2));
      if (shake > 0) shake = Math.max(0, shake - 70 * S * dt);
      if (flash > 0) flash = Math.max(0, flash - 2.8 * dt);
      if (chroma > 0) chroma = Math.max(0, chroma - 1.8 * dt);
      if (flapSquash > 0) flapSquash = Math.max(0, flapSquash - 7 * dt);
      if (comboPulse > 0) comboPulse = Math.max(0, comboPulse - 2.4 * dt);
      if (hudPop > 0) hudPop = Math.max(0, hudPop - 4 * dt);
      if (bestBannerT > 0) bestBannerT = Math.max(0, bestBannerT - dt);
      if (surgeT > 0) surgeT = Math.max(0, surgeT - dt);
      if (surgeWarn > 0) surgeWarn = Math.max(0, surgeWarn - 1.6 * dt);
      if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - 2.2 * dt);
      if (glitchT > 0) {
        glitchT = Math.max(0, glitchT - dt);
        if (Math.random() < dt * 28 * (0.4 + heatSmooth)) spawnGlitch();
      } else if (state === STATE.PLAY && heatSmooth > 0.45 && Math.random() < dt * 6 * heatSmooth) {
        spawnGlitch();
      }

      var i;
      for (i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 380 * S * dt; p.vx *= 0.97; p.rot += dt * 8;
        if (p.t >= p.life) particles.splice(i, 1);
      }
      for (i = floaters.length - 1; i >= 0; i--) {
        floaters[i].t += dt;
        floaters[i].y -= 70 * S * dt;
        if (floaters[i].t >= floaters[i].life) floaters.splice(i, 1);
      }
      for (i = slashes.length - 1; i >= 0; i--) {
        slashes[i].t += dt;
        if (slashes[i].t >= slashes[i].life) slashes.splice(i, 1);
      }
      for (i = glitches.length - 1; i >= 0; i--) {
        glitches[i].t += dt;
        if (glitches[i].t >= glitches[i].life) glitches.splice(i, 1);
      }

      if (state === STATE.MENU) {
        player.y = H * 0.44 + Math.sin(time * 3.1) * 7 * S;
        player.rot = Math.sin(time * 3.1) * 0.08;
        trailPush();
        return;
      }

      player.vy += 2280 * S * dt;
      player.vy = clamp(player.vy, -980 * S, 980 * S);
      player.y += player.vy * dt;
      var targetRot = clamp(player.vy / (480 * S), -0.62, 1.25);
      if (state === STATE.DEAD) targetRot = Math.min(1.45, player.rot + 5 * dt);
      player.rot += (targetRot - player.rot) * Math.min(1, 14 * dt);
      trailPush();

      var spd = 0;
      if (state === STATE.PLAY) spd = pipeSpeed();
      else if (state === STATE.DEAD) spd = pipeSpeed() * 0.18;

      var lastX = 0;
      var bobSpeed = 1.6 + heatSmooth * 1.4;
      for (i = 0; i < pipes.length; i++) {
        var pipe = pipes[i];
        pipe.x -= spd * dt;
        if (pipe.flash > 0) pipe.flash = Math.max(0, pipe.flash - 3 * dt);
        if (state === STATE.PLAY) {
          var amp = pipe.bobAmp;
          var ny = pipe.baseGapY + Math.sin(time * bobSpeed + pipe.phase) * amp;
          var half = pipe.gap * 0.5;
          pipe.gapY = clamp(ny, 56 * S + half, H - groundH - 36 * S - half);
        }
        lastX = Math.max(lastX, pipe.x);
        if (state === STATE.PLAY && !pipe.scored && pipe.x + pipe.w < player.x) {
          var topLip = pipe.gapY - pipe.gap * 0.5;
          var botLip = pipe.gapY + pipe.gap * 0.5;
          var dist = Math.min(player.y - topLip, botLip - player.y);
          onScore(pipe, dist < 20 * S);
        }
      }

      if (state === STATE.PLAY) {
        if (lastX < W - 16 * S) {
          var space = pipeSpacing() * (1 + irregular() * rand(-1, 1));
          spawnPipe(lastX + space, false);
        }
        while (pipes.length && pipes[0].x + pipes[0].w < -50 * S) pipes.shift();
        collide();
      }

      if (state === STATE.DEAD) {
        deadT += realDt;
        if (player.y > H - groundH - 6 * S) {
          player.y = H - groundH - 6 * S;
          player.vy *= 0.2;
        }
        if (deadT > 0.72) finishDeath();
      }
    }

    function trailPush() {
      trail.push({ x: player.x, y: player.y, rot: player.rot, a: 1 });
      if (trail.length > 8) trail.shift();
    }

    function collide() {
      var hitR = player.r * 0.58;
      if (player.y + hitR > H - groundH || player.y - hitR < 2 * S) { die(); return; }
      for (var i = 0; i < pipes.length; i++) {
        var p = pipes[i];
        if (player.x + hitR < p.x || player.x - hitR > p.x + p.w) continue;
        var top = p.gapY - p.gap * 0.5;
        var bot = p.gapY + p.gap * 0.5;
        if (player.y - hitR < top || player.y + hitR > bot) { die(); return; }
      }
    }

    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBg() {
      ctx.fillStyle = '#09060c';
      ctx.fillRect(0, 0, W, H);

      var hx = heatSmooth;
      var g = ctx.createRadialGradient(W * 0.5, H * 0.38, 20, W * 0.5, H * 0.4, H * 0.75);
      g.addColorStop(0, hx > 0.55 ? 'rgba(255,20,80,0.22)' : 'rgba(180,20,140,0.14)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      if (hx > 0.25) {
        ctx.save();
        ctx.globalAlpha = 0.08 + hx * 0.12;
        ctx.strokeStyle = combo >= 4 ? '#d0ff3a' : '#ff2bd6';
        ctx.lineWidth = 1;
        var gap = 28 * S;
        var off = (time * (30 + hx * 80) * S) % gap;
        ctx.beginPath();
        for (var x = -H; x < W + H; x += gap) {
          ctx.moveTo(x + off, 0);
          ctx.lineTo(x + off - H, H);
        }
        ctx.stroke();
        ctx.restore();
      }

      if (hx > 0.6) {
        var pulse = 0.5 + 0.5 * Math.sin(time * (10 + combo));
        ctx.fillStyle = 'rgba(255,20,70,' + (0.04 * pulse * hx) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawGlitches() {
      for (var i = 0; i < glitches.length; i++) {
        var g = glitches[i];
        ctx.globalAlpha = 1 - g.t / g.life;
        ctx.fillStyle = g.color;
        ctx.fillRect(g.x, g.y, g.w, g.h);
      }
      ctx.globalAlpha = 1;
    }

    function drawPipes() {
      for (var i = 0; i < pipes.length; i++) drawGate(pipes[i]);
    }

    function drawGate(p) {
      var x = p.x, w = p.w;
      var top = p.gapY - p.gap * 0.5;
      var bot = p.gapY + p.gap * 0.5;
      var neon = p.hot ? '#ff2b4a' : (p.flash > 0 ? '#d0ff3a' : (heatSmooth > 0.5 ? '#ff2bd6' : '#2bfff0'));
      ctx.save();
      ctx.translate(x + w * 0.5, p.gapY);
      ctx.rotate(p.tilt * Math.sin(time * 1.3 + p.phase) * (0.4 + heatSmooth));
      ctx.translate(-(x + w * 0.5), -p.gapY);

      drawBlade(x, 0, w, top, neon, true, p);
      drawBlade(x, bot, w, H - groundH - bot, neon, false, p);

      ctx.strokeStyle = neon;
      ctx.globalAlpha = 0.85 + p.flash * 0.15;
      ctx.lineWidth = (p.hot ? 3.2 : 2.2) * S;
      ctx.beginPath();
      ctx.moveTo(x - 6 * S, top);
      ctx.lineTo(x + w + 6 * S, top);
      ctx.moveTo(x - 6 * S, bot);
      ctx.lineTo(x + w + 6 * S, bot);
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (p.hot || p.flash > 0) {
        ctx.strokeStyle = neon;
        ctx.globalAlpha = 0.35 + 0.4 * Math.abs(Math.sin(time * 12));
        ctx.lineWidth = 6 * S;
        ctx.strokeRect(x - 8 * S, top - 10 * S, w + 16 * S, p.gap + 20 * S);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function drawBlade(x, y, w, h, neon, invert, p) {
      if (h <= 1) return;
      var grd = ctx.createLinearGradient(x, y, x + w, y);
      grd.addColorStop(0, '#050508');
      grd.addColorStop(0.35, '#1a1a22');
      grd.addColorStop(0.5, '#3a3a48');
      grd.addColorStop(0.65, '#14141a');
      grd.addColorStop(1, '#050508');
      ctx.fillStyle = grd;
      ctx.beginPath();
      if (invert) {
        ctx.moveTo(x + 6 * S, y);
        ctx.lineTo(x + w - 6 * S, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
      } else {
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w - 6 * S, y + h);
        ctx.lineTo(x + 6 * S, y + h);
      }
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = neon;
      ctx.globalAlpha = 0.18 + (p.hot ? 0.12 : 0);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + w * 0.18, y + 4 * S, 3 * S, Math.max(4, h - 8 * S));

      var chev = 16 * S;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2 * S;
      for (var yy = y + 10 * S; yy < y + h - 8 * S; yy += chev) {
        ctx.beginPath();
        ctx.moveTo(x + 10 * S, yy);
        ctx.lineTo(x + w * 0.5, yy + 6 * S);
        ctx.lineTo(x + w - 10 * S, yy);
        ctx.stroke();
      }
    }

    function drawGround() {
      var y = H - groundH;
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, y, W, groundH);
      ctx.fillStyle = '#ff2bd6';
      ctx.fillRect(0, y, W, 3 * S);
      ctx.fillStyle = '#d0ff3a';
      ctx.fillRect(0, y + 3 * S, W, 2 * S);

      var stripe = 22 * S;
      var off = (state === STATE.PLAY || state === STATE.DEAD) ? (time * pipeSpeed() * 0.9) % (stripe * 2) : (time * 40 * S) % (stripe * 2);
      for (var x = -stripe * 2 - off; x < W + stripe; x += stripe * 2) {
        ctx.fillStyle = '#111118';
        ctx.beginPath();
        ctx.moveTo(x, y + 8 * S);
        ctx.lineTo(x + stripe, y + 8 * S);
        ctx.lineTo(x + stripe * 0.55, H);
        ctx.lineTo(x - stripe * 0.45, H);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPlayer() {
      var u = S;
      var i, g;
      if (combo >= 2 || heatSmooth > 0.35) {
        for (i = 0; i < trail.length; i++) {
          g = trail[i];
          ctx.save();
          ctx.translate(g.x, g.y);
          ctx.rotate(g.rot);
          ctx.globalAlpha = (i / trail.length) * 0.28 * (0.4 + heatSmooth);
          ctx.fillStyle = i % 2 ? '#ff2bd6' : '#2bfff0';
          ctx.fillRect(-10 * u, -14 * u, 22 * u, 28 * u);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      if (chroma > 0.05) {
        ctx.save();
        ctx.globalAlpha = chroma * 0.45;
        ctx.translate(player.x - 4 * u, player.y);
        ctx.rotate(player.rot);
        ctx.fillStyle = '#2bfff0';
        drawBody(u, true);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = chroma * 0.45;
        ctx.translate(player.x + 4 * u, player.y);
        ctx.rotate(player.rot);
        ctx.fillStyle = '#ff2bd6';
        drawBody(u, true);
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.rot);
      var sc = 1 + flapSquash * 0.16;
      var sy = 1 - flapSquash * 0.12;
      ctx.scale(sc, sy);
      drawBody(u, false);
      ctx.restore();
    }

    function drawBody(u, silhouette) {
      if (silhouette) {
        ctx.beginPath();
        ctx.moveTo(-8 * u, 16 * u);
        ctx.lineTo(12 * u, 14 * u);
        ctx.lineTo(10 * u, -4 * u);
        ctx.lineTo(-10 * u, -2 * u);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.arc(1 * u, -8 * u, 12 * u, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(2 * u, 18 * u, 12 * u, 4 * u, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0a0a0e';
      ctx.beginPath();
      ctx.moveTo(-9 * u, 4 * u);
      ctx.lineTo(-14 * u, 26 * u);
      ctx.lineTo(4 * u, 28 * u);
      ctx.lineTo(16 * u, 22 * u);
      ctx.lineTo(12 * u, 4 * u);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff2bd6';
      ctx.beginPath();
      ctx.moveTo(-2 * u, 8 * u);
      ctx.lineTo(6 * u, 14 * u);
      ctx.lineTo(-1 * u, 16 * u);
      ctx.lineTo(4 * u, 24 * u);
      ctx.lineTo(-6 * u, 14 * u);
      ctx.lineTo(2 * u, 13 * u);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f4efe6';
      ctx.beginPath();
      ctx.ellipse(1 * u, -6 * u, 13 * u, 14 * u, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f7f4ee';
      ctx.beginPath();
      ctx.moveTo(-14 * u, -8 * u);
      ctx.quadraticCurveTo(-16 * u, -24 * u, 0, -22 * u);
      ctx.quadraticCurveTo(16 * u, -24 * u, 15 * u, -6 * u);
      ctx.quadraticCurveTo(14 * u, 8 * u, 10 * u, 10 * u);
      ctx.lineTo(-12 * u, 8 * u);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#d8d2c6';
      ctx.beginPath();
      ctx.moveTo(-14 * u, -6 * u);
      ctx.lineTo(-4 * u, -4 * u);
      ctx.lineTo(-12 * u, 8 * u);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(4 * u, -8 * u);
      ctx.lineTo(15 * u, -6 * u);
      ctx.lineTo(11 * u, 8 * u);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#1a1520';
      ctx.fillRect(-12 * u, -12 * u, 24 * u, 6 * u);
      ctx.fillRect(-13 * u, -10 * u, 5 * u, 3 * u);
      ctx.fillRect(8 * u, -10 * u, 5 * u, 3 * u);

      ctx.fillStyle = '#0a0a0e';
      ctx.fillRect(-8 * u, -7 * u, 7 * u, 3.2 * u);
      ctx.fillRect(3 * u, -7 * u, 7 * u, 3.2 * u);
      ctx.fillStyle = '#ff2bd6';
      ctx.fillRect(-7 * u, -6.2 * u, 5 * u, 1.4 * u);
      ctx.fillRect(4 * u, -6.2 * u, 5 * u, 1.4 * u);

      ctx.fillStyle = '#ff2b4a';
      ctx.beginPath();
      ctx.moveTo(-3 * u, 2 * u);
      ctx.lineTo(6 * u, 3 * u);
      ctx.lineTo(-2 * u, 5.5 * u);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#0a0a0e';
      ctx.lineWidth = 1.6 * u;
      ctx.beginPath();
      ctx.moveTo(-9 * u, -8 * u);
      ctx.lineTo(-13 * u, -11 * u);
      ctx.moveTo(9 * u, -8 * u);
      ctx.lineTo(13 * u, -11 * u);
      ctx.stroke();
    }

    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var a = 1 - p.t / p.life;
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        if (p.kind === 'shard') {
          ctx.beginPath();
          ctx.moveTo(0, -p.size);
          ctx.lineTo(p.size * 0.7, p.size);
          ctx.lineTo(-p.size * 0.5, p.size * 0.4);
          ctx.closePath();
          ctx.fill();
        } else if (p.kind === 'slash') {
          ctx.fillRect(-p.size * 1.8, -1.1 * S, p.size * 3.6, 2.2 * S);
        } else if (p.kind === 'rect') {
          ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
        } else if (p.kind === 'spark') {
          ctx.fillRect(-1 * S, -p.size, 2 * S, p.size * 2);
          ctx.fillRect(-p.size, -1 * S, p.size * 2, 2 * S);
        } else {
          ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawSlashes() {
      for (var i = 0; i < slashes.length; i++) {
        var s = slashes[i];
        var a = 1 - s.t / s.life;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.ang);
        ctx.globalAlpha = a;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3 * S;
        ctx.beginPath();
        ctx.moveTo(-s.len * 0.5, 0);
        ctx.lineTo(s.len * 0.5, 0);
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawFloaters() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var i = 0; i < floaters.length; i++) {
        var f = floaters[i];
        var a = 1 - f.t / f.life;
        var pop = 1 + (1 - f.t / f.life) * 0.15;
        ctx.globalAlpha = a;
        ctx.font = '900 ' + (f.size * pop) + 'px ' + FONT;
        ctx.letterSpacing = '0.06em';
        ctx.strokeStyle = '#09060c';
        ctx.lineWidth = 5 * S;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawScanlines() {
      if (heatSmooth < 0.2 && state !== STATE.DEAD) return;
      ctx.fillStyle = 'rgba(0,0,0,' + (0.08 + heatSmooth * 0.08) + ')';
      var step = 4 * S;
      for (var y = 0; y < H; y += step) ctx.fillRect(0, y, W, 1.2 * S);
    }

    function drawHud() {
      if (state !== STATE.PLAY && state !== STATE.DEAD) return;
      var pop = 1 + hudPop * 0.22;
      var y = 26 * S + safeTop;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = '900 ' + (58 * S * pop) + 'px ' + FONT;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#09060c';
      ctx.lineWidth = 10 * S;
      ctx.strokeText(String(score), W * 0.5, y);
      ctx.fillStyle = combo >= 4 ? '#d0ff3a' : '#ffffff';
      ctx.fillText(String(score), W * 0.5, y);

      if (combo > 1) {
        var cs = 1 + comboPulse * 0.4;
        ctx.font = '900 ' + (15 * S * cs) + 'px ' + FONT;
        ctx.fillStyle = combo >= 5 ? '#d0ff3a' : '#ff2bd6';
        ctx.strokeText('x' + combo + (combo >= 5 ? '  OD' : ''), W * 0.5, y + 64 * S);
        ctx.fillText('x' + combo + (combo >= 5 ? '  OD' : ''), W * 0.5, y + 64 * S);
      }

      var bw = 88 * S, bh = 5 * S;
      var bx = W * 0.5 - bw * 0.5, by = y + (combo > 1 ? 86 : 66) * S;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = combo >= 5 ? '#d0ff3a' : '#ff2bd6';
      ctx.fillRect(bx, by, bw * heatSmooth, bh);

      if (surgeWarn > 0) {
        ctx.globalAlpha = Math.min(1, surgeWarn * 1.4);
        ctx.font = '900 ' + (32 * S) + 'px ' + FONT;
        ctx.fillStyle = '#ff2b4a';
        ctx.strokeText('SURGE', W * 0.5, H * 0.22);
        ctx.fillText('SURGE', W * 0.5, H * 0.22);
        ctx.globalAlpha = 1;
      }
    }

    function drawMenu() {
      var y0 = H * 0.12 + safeTop;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = '900 ' + (12 * S) + 'px ' + FONT;
      ctx.fillStyle = '#ff2bd6';
      ctx.fillText('SHORT N\' SWEET', W * 0.5, y0);

      drawGlitchTitle('FLAPPY', W * 0.5, y0 + 40 * S, 52 * S);

      ctx.font = '900 ' + (13 * S) + 'px ' + FONT;
      ctx.fillStyle = '#d0ff3a';
      ctx.fillText('DON\'T PLAY NICE', W * 0.5, y0 + 82 * S);

      var bob = Math.sin(time * 5) * 3 * S;
      var pw = 220 * S, ph = 50 * S;
      var px = W * 0.5 - pw * 0.5, py = H * 0.7 + bob;
      ctx.fillStyle = '#ff2bd6';
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = '#09060c';
      ctx.fillRect(px + 4 * S, py + 4 * S, pw, ph);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px, py, pw, ph);
      ctx.font = '900 ' + (16 * S) + 'px ' + FONT;
      ctx.fillStyle = '#09060c';
      ctx.fillText('TAP TO RIDE', W * 0.5, py + ph * 0.52);

      if (best > 0) {
        ctx.font = '900 ' + (12 * S) + 'px ' + FONT;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillText('BEST  ' + best, W * 0.5, py + ph + 28 * S);
      }

      ctx.font = '700 ' + (11 * S) + 'px ' + FONT;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('GRAZE THE EDGE  ·  CHAIN COMBOS  ·  SURVIVE SURGES', W * 0.5, H - groundH - 20 * S);
    }

    function drawGlitchTitle(text, x, y, size) {
      ctx.font = '900 ' + size + 'px ' + FONT;
      var ox = Math.sin(time * 17) * 2.5 * S * (0.4 + 0.6 * (Math.sin(time * 3) > 0.7 ? 1 : 0));
      ctx.fillStyle = '#2bfff0';
      ctx.fillText(text, x - 3 * S + ox, y);
      ctx.fillStyle = '#ff2bd6';
      ctx.fillText(text, x + 3 * S - ox, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, x, y);
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      var cardW = Math.min(W - 36 * S, 340 * S);
      var cardH = 372 * S;
      var cx = (W - cardW) * 0.5;
      var cy = (H - cardH) * 0.4;

      ctx.fillStyle = '#ff2bd6';
      ctx.fillRect(cx + 6 * S, cy + 6 * S, cardW, cardH);
      ctx.fillStyle = '#09060c';
      ctx.fillRect(cx, cy, cardW, cardH);
      ctx.fillStyle = '#d0ff3a';
      ctx.fillRect(cx, cy, 6 * S, cardH);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 ' + (14 * S) + 'px ' + FONT;
      ctx.fillStyle = newBest ? '#d0ff3a' : '#ff2bd6';
      ctx.fillText(newBest ? 'NEW BEST' : 'YOU BROKE', cx + cardW * 0.5, cy + 36 * S);

      ctx.font = '900 ' + (72 * S) + 'px ' + FONT;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(score), cx + cardW * 0.5, cy + 108 * S);

      ctx.font = '900 ' + (13 * S) + 'px ' + FONT;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('BEST  ' + best, cx + cardW * 0.5, cy + 156 * S);

      var med = medalFor(score);
      drawMedal(cx + cardW * 0.5, cy + 214 * S, 36 * S, med);
      ctx.font = '900 ' + (12 * S) + 'px ' + FONT;
      ctx.fillStyle = med ? '#ffffff' : 'rgba(255,255,255,0.3)';
      ctx.fillText(med ? med.name : 'NO RANK', cx + cardW * 0.5, cy + 262 * S);

      var pw = 196 * S, ph = 46 * S;
      var px = cx + (cardW - pw) * 0.5;
      var py = cy + cardH - 66 * S;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = '#09060c';
      ctx.font = '900 ' + (15 * S) + 'px ' + FONT;
      ctx.fillText('TAP — AGAIN', cx + cardW * 0.5, py + ph * 0.52);

      if (newBest && bestBannerT > 0) {
        ctx.globalAlpha = Math.min(1, bestBannerT);
        ctx.font = '900 ' + (24 * S) + 'px ' + FONT;
        ctx.fillStyle = '#d0ff3a';
        ctx.strokeStyle = '#09060c';
        ctx.lineWidth = 8 * S;
        ctx.strokeText('NEW BEST', W * 0.5, cy - 26 * S);
        ctx.fillText('NEW BEST', W * 0.5, cy - 26 * S);
        ctx.globalAlpha = 1;
      }
    }

    function drawMedal(x, y, r, med) {
      ctx.save();
      ctx.translate(x, y);
      if (!med) {
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 3 * S;
        ctx.strokeRect(-r, -r, r * 2, r * 2);
        ctx.restore();
        return;
      }
      ctx.fillStyle = med.c1;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.strokeStyle = med.c2;
      ctx.lineWidth = 3 * S;
      ctx.strokeRect(-r, -r, r * 2, r * 2);
      ctx.fillStyle = med.c2;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.45);
      ctx.lineTo(r * 0.38, r * 0.4);
      ctx.lineTo(-r * 0.45, -r * 0.05);
      ctx.lineTo(r * 0.45, -r * 0.05);
      ctx.lineTo(-r * 0.38, r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function render() {
      var ox = 0, oy = 0;
      if (shake > 0) {
        ox = rand(-shake, shake);
        oy = rand(-shake, shake);
      }
      ctx.save();
      ctx.translate(ox, oy);
      drawBg();
      drawPipes();
      drawGround();
      drawPlayer();
      drawParticles();
      drawSlashes();
      drawFloaters();
      drawGlitches();
      ctx.restore();

      drawScanlines();

      if (flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.28) + ')';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255,43,214,' + (flash * 0.12) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      if (deathFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (deathFlash * 0.65) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      if (surgeT > 0 && state === STATE.PLAY) {
        ctx.strokeStyle = 'rgba(255,43,74,' + (0.25 + 0.25 * Math.sin(time * 14)) + ')';
        ctx.lineWidth = 8 * S;
        ctx.strokeRect(4 * S, 4 * S, W - 8 * S, H - 8 * S);
      }

      drawHud();
      if (state === STATE.MENU) drawMenu();
      if (state === STATE.OVER) drawGameOver();
    }

    function frame(ts) {
      if (!lastTs) lastTs = ts;
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (dt > 0.05) dt = 0.05;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    var touchSeen = 0;
    function bindInput() {
      var opts = { passive: false, capture: true };
      canvas.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch' && performance.now() - touchSeen < 80) return;
        onInput(e);
      }, opts);
      canvas.addEventListener('touchstart', function (e) {
        touchSeen = performance.now();
        onInput(e);
      }, opts);
      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
          e.preventDefault();
          onInput(e);
        }
      });
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('visibilitychange', function () {
        lastTs = performance.now();
        if (document.hidden && canVibrate()) {
          try { navigator.vibrate(0); } catch (err) { /* ignore */ }
        }
      });
    }

    resize();
    resetRun(false);
    bindInput();
    window.addEventListener('resize', resize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', function () { resize(); });
    }
    window.addEventListener('orientationchange', function () { setTimeout(resize, 80); });
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
